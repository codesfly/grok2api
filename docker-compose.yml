# 精简部署：仅运行 grok2api 与 statsig-signer。
services:
  grok2api:
    container_name: grok2api
    image: ghcr.io/codesfly/grok2api:latest
    ports:
      - "${HOST_PORT:-8000}:${SERVER_PORT:-8000}"
    environment:
      TZ: Asia/Shanghai
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SERVER_HOST: ${SERVER_HOST:-0.0.0.0}
      SERVER_PORT: ${SERVER_PORT:-8000}
      SERVER_WORKERS: ${SERVER_WORKERS:-1}
      ACCOUNT_STORAGE: ${ACCOUNT_STORAGE:-local}
      ACCOUNT_LOCAL_PATH: ${ACCOUNT_LOCAL_PATH:-data/accounts.db}
      ACCOUNT_REDIS_URL: ${ACCOUNT_REDIS_URL:-}
      ACCOUNT_MYSQL_URL: ${ACCOUNT_MYSQL_URL:-}
      ACCOUNT_POSTGRESQL_URL: ${ACCOUNT_POSTGRESQL_URL:-}
      GROK_STATSIG_SIGNER_URL: ${GROK_STATSIG_SIGNER_URL:-http://statsig-signer:3000/sign}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      - statsig-signer
    restart: unless-stopped

  statsig-signer:
    container_name: statsig-signer
    image: ghcr.io/codesfly/statsig-signer:latest
    # 用 Docker 自带 tini 当 1 号进程，回收 Chromium 反复 launch/close 留下的
    # headless_shell 僵尸子进程（node 作 PID 1 不会收养孤儿进程）。
    init: true
    environment:
      TZ: Asia/Shanghai
      PORT: "3000"
      GROK_SSO_TOKEN: ${GROK_SSO_TOKEN:-}
      PROXY_URL: ${STATSIG_PROXY_URL:-}
    volumes:
      - ./data:/app/data:ro
      - ./statsig-signer/server.js:/app/server.js:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 512M
